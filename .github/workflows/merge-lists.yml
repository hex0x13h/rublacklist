name: Merge Lists

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  merge-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize rule lists
        run: |
          {
            find rules/services -name "*.list" | sort
            find rules/asn -name "*.list" | sort
            find rules/categories -name "*.list" | sort
            find sources -name "*.list" | sort
            find . -name "*.list" \
              -not -path "./.git/*" \
              -not -path "./rules/services/*" \
              -not -path "./rules/asn/*" \
              -not -path "./rules/categories/*" \
              -not -path "./rules/aggregates/*" \
              -not -path "./sources/*" \
              -not -path "./merged_bypass_list/*" \
              -not -name "bypass.list" \
              -not -name "domains.list" \
              -not -name "full.list" \
              | sort
          } > rule-files.txt

          python3 scripts/normalize-surge-lists.py --global-dedupe $(cat rule-files.txt)

      - name: Merge lists and remove duplicates
        run: |
          mkdir -p rules/aggregates

          cat $(cat rule-files.txt) \
            | sort -u > bypass.list

          cp bypass.list rules/aggregates/all-bypass.list

      - name: Validate Surge rule lists
        run: |
          python3 scripts/validate-surge-lists.py $(cat rule-files.txt) bypass.list rules/aggregates/all-bypass.list

      - name: Generate Amnezia bypass list
        run: |
          python3 scripts/normalize-surge-lists.py --amnezia-json Amnezia/bypass.json bypass.list

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          rm -f rule-files.txt
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Normalize Surge rule lists" && git push)
