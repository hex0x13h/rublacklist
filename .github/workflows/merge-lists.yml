name: Merge Lists

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  merge-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize rule lists
        run: |
          find . -name "*.list" \
            -not -path "./.git/*" \
            -not -path "./rules/aggregates/*" \
            -not -path "./merged_bypass_list/*" \
            -not -name "bypass.list" \
            -not -name "domains.list" \
            -not -name "full.list" \
            | sort > rule-files.txt

          python3 scripts/normalize-surge-lists.py --global-dedupe $(cat rule-files.txt)

      - name: Merge lists and remove duplicates
        run: |
          mkdir -p rules/aggregates

          cat $(cat rule-files.txt) \
            | sort -u > bypass.list

          cp bypass.list rules/aggregates/all-bypass.list

          mkdir -p merged_bypass_list
          cp bypass.list merged_bypass_list/merged_bypass.list

      - name: Generate Amnezia bypass list
        run: |
          python3 scripts/normalize-surge-lists.py --amnezia-json Amnezia/bypass.json bypass.list

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          rm -f rule-files.txt
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Normalize Surge rule lists" && git push)
